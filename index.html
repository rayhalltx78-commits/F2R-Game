<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Tycoon — Desktop Edition</title><link rel="stylesheet" href="style.css"></head>
<body><div class="desktop"><div class="desktop-top"><strong>◈ Business Tycoon <span class="muted">Desktop Edition</span></strong><div class="top-right"><span class="version">v0.3.2 · Single Player</span><span id="clock">--:--</span></div></div>
<div class="workspace" id="workspace"><div class="wallpaper-brand"><div class="wallpaper-logo">◈</div><strong>BUSINESS TYCOON</strong><span>Build your empire.</span></div><aside class="desktop-icons" id="desktopIcons" aria-label="Desktop applications"></aside><section class="window" id="appWindow"><div class="window-titlebar"><div class="lights"><button class="light red" id="closeWindow" title="Close application" aria-label="Close application"></button><button class="light yellow" id="minWindow" title="Minimize application" aria-label="Minimize application"></button><button class="light green" id="maxWindow" title="Restore application" aria-label="Restore application"></button></div><span class="window-title" id="windowTitle">My Corporation</span><span class="window-hint">Business Management System</span></div><div class="window-content" id="windowContent"></div></section></div>
<div class="start-menu" id="startMenu" hidden><div class="start-heading">◈ Business Tycoon <small>Desktop Applications</small></div><div class="start-apps" id="startApps"></div><div class="start-footer"><span>Single-player simulation</span><button id="showDesktop">Show desktop</button></div></div><div class="taskbar"><button id="launcher" class="start-button" aria-expanded="false">◈ Start</button><button id="taskApp" class="selected">My Corporation</button><div class="spacer"></div><small id="saveStatus">Local save</small><span class="tray-clock" id="trayClock">--:--</span></div></div>
<script>
(()=>{'use strict';
const KEY='business-tycoon-v010';const catalog={retail:{label:'Retail',cost:15000,revenue:300,expense:175,staff:3},manufacturing:{label:'Manufacturing',cost:35000,revenue:760,expense:510,staff:8},services:{label:'Services',cost:10000,revenue:210,expense:105,staff:2}};
const apps=[['dashboard','🏢','My Corporation'],['businesses','🏬','Businesses'],['production','🏭','Manufacturing'],['employees','👥','Employees'],['inventory','📦','Inventory'],['logistics','🚚','Logistics'],['markets','📈','Markets'],['banking','🏦','Banking'],['research','🔬','Research'],['finances','💰','Finances'],['settings','⚙️','Settings']];
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n),unix=()=>Math.floor(Date.now()/1000),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state=null,lastTick=unix(),unsaved=false,current='dashboard',minimized=false,maximized=false;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.version===1&&typeof s.company==='string'&&Array.isArray(s.businesses)&&Number.isFinite(s.cash)&&Number.isFinite(s.activeSeconds)){state=s;state.log=Array.isArray(s.log)?s.log:[];state.nextId=Number.isFinite(s.nextId)?s.nextId:state.businesses.length+1;return}}catch(e){console.warn('Save unavailable',e)}}
function save(){if(!state)return;state.savedAt=unix();try{localStorage.setItem(KEY,JSON.stringify(state));unsaved=false;$('saveStatus').textContent='Saved · '+new Date().toLocaleTimeString()}catch(e){unsaved=true;$('saveStatus').textContent='Save unavailable'}}
function log(s){state.log.unshift(new Date().toLocaleTimeString()+' — '+s);state.log=state.log.slice(0,12)}
function createBusiness(type,name){const c=catalog[type];if(!c||state.cash<c.cost)return false;state.cash-=c.cost;state.expenses+=c.cost;state.businesses.push({id:state.nextId++,name,type,cycles:0,invested:c.cost});log('Opened '+name+' ('+c.label+') for '+money(c.cost));save();render();return true}
function val(){return state.cash+state.businesses.reduce((s,b)=>s+(Number(b.invested)||0),0)}
function totals(){return state.businesses.reduce((s,b)=>{const c=catalog[b.type];if(c){s.staff+=c.staff;s.income+=c.revenue;s.cost+=c.expense}return s},{staff:0,income:0,cost:0})}
function stat(label,value){return '<div class="stat-card"><small>'+label+'</small><div class="stat">'+value+'</div></div>'}
function businessRows(){return state.businesses.map(b=>{const c=catalog[b.type];return '<div class="business"><strong>'+esc(b.name)+'</strong><p class="muted">'+esc(c?c.label:b.type)+' · '+(c?c.staff:0)+' employees · '+money(c?c.revenue:0)+' revenue / '+money(c?c.expense:0)+' expenses per active minute · '+b.cycles+' cycles</p></div>'}).join('')||'<div class="empty">No businesses established yet.</div>'}
function openForm(){return '<h2>Open a Business</h2><label for="newIndustry">Industry</label><select id="newIndustry"><option value="retail">Retail — $15,000</option><option value="manufacturing">Manufacturing — $35,000</option><option value="services">Services — $10,000</option></select><label for="businessName">Business name</label><input id="businessName" maxlength="50" placeholder="New business name"><button class="primary" id="openBusiness">Open business</button><p class="error" id="businessError" aria-live="polite"></p>'}
function render(){const name=apps.find(a=>a[0]===current)?.[2]||'My Corporation';$('windowTitle').textContent=state?name:'Company Registration';$('taskApp').textContent=state?name:'Register Company';$('taskApp').classList.toggle('selected',!minimized);$('appWindow').hidden=minimized;$('appWindow').classList.toggle('maximized',maximized);$('desktopIcons').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.app===current&&!minimized));if(minimized)return;
if(!state){$('windowContent').innerHTML='<div class="register-wrap"><div class="card"><h1>Establish Your Corporation</h1><p class="muted">Start with $100,000. Choose your company name and first business.</p><label for="company">Company name</label><input id="company" maxlength="50" placeholder="Example: Horizon Holdings"><label for="industry">First business industry</label><select id="industry"><option value="retail">Retail</option><option value="manufacturing">Manufacturing</option><option value="services">Services</option></select><button class="primary" id="start">Create company</button><p id="registerError" class="error" aria-live="polite"></p></div></div>';return}
const t=totals();let html='';if(current==='dashboard'){html='<div class="section-head"><div><h1>'+esc(state.company)+'</h1><span class="muted">Corporate Overview</span></div><span class="pill">● Operating</span></div><div class="stats">'+stat('Cash Balance',money(state.cash))+stat('Company Value',money(val()))+stat('Total Revenue',money(state.revenue))+stat('Total Expenses',money(state.expenses))+'</div><div class="grid2"><div class="card"><h2>Company Overview</h2><div class="report-row"><span>Businesses</span><strong>'+state.businesses.length+'</strong></div><div class="report-row"><span>Employees</span><strong>'+t.staff+'</strong></div><div class="report-row"><span>Active operating minutes</span><strong>'+Math.floor(state.activeSeconds/60)+'</strong></div><div class="report-row"><span>Estimated profit / active minute</span><strong>'+money(t.income-t.cost)+'</strong></div></div><div class="card"><h2>Recent Activity</h2>'+(state.log.map(s=>'<p class="muted">'+esc(s)+'</p>').join('')||'<p class="muted">No activity yet.</p>')+'</div></div><div class="card"><h2>Your Businesses</h2>'+businessRows()+'</div>'}
else if(current==='businesses'){html='<div class="section-head"><div><h1>Businesses</h1><p class="muted">Establish and manage your company portfolio.</p></div><span class="pill">'+state.businesses.length+' locations</span></div><div class="grid2"><div class="card">'+openForm()+'</div><div class="card"><h2>Portfolio</h2>'+businessRows()+'</div></div>'}
else if(current==='finances'){html='<h1>Finances</h1><p class="toolbar-note">Company-wide financial summary. Figures update with each active operating minute.</p><div class="stats">'+stat('Cash',money(state.cash))+stat('Asset Value',money(val()))+stat('Revenue',money(state.revenue))+stat('Expenses',money(state.expenses))+'</div><div class="card"><h2>Operating Statement</h2><div class="report-row"><span>Revenue per minute</span><strong>'+money(t.income)+'</strong></div><div class="report-row"><span>Operating cost per minute</span><strong>'+money(t.cost)+'</strong></div><div class="report-row"><span>Operating profit per minute</span><strong>'+money(t.income-t.cost)+'</strong></div><div class="report-row"><span>Lifetime net result (including startup costs)</span><strong>'+money(state.revenue-state.expenses)+'</strong></div></div>'}
else if(current==='employees'){html='<h1>Employees</h1><p class="toolbar-note">Staffing is currently determined by the industry of each business. Hiring controls will come later.</p><div class="stats">'+stat('Total Employees',t.staff)+stat('Businesses',state.businesses.length)+'</div><div class="card"><h2>Workforce by Business</h2>'+state.businesses.map(b=>'<div class="report-row"><span>'+esc(b.name)+'</span><strong>'+(catalog[b.type]?.staff||0)+' employees</strong></div>').join('')+'</div>'}
else if(current==='settings'){html='<h1>Settings</h1><div class="card"><h2>Simulation</h2><p>Single-player · fixed real-time speed · Unix timestamp checkpoints</p><p class="muted">The simulation advances only while this page is active. No offline earnings, time controls, or automatic resets.</p><button class="primary" id="saveNow">Save now</button><p class="muted">Progress is stored in this browser. LSL persistence is not connected yet.</p></div>'}
else {const item=apps.find(a=>a[0]===current);html='<h1>'+esc(item[2])+'</h1><div class="notice">This application is reserved for a future game update. Existing business operations continue running while you browse the desktop.</div>'}
$('windowContent').innerHTML=html;}
function hideMenu(){$('startMenu').hidden=true;$('launcher').setAttribute('aria-expanded','false')}function navigate(id){if(!state&&id!=='dashboard')return;current=id;minimized=false;hideMenu();render()}
function tick(){const now=unix(),delta=Math.max(0,Math.min(now-lastTick,5));lastTick=now;if(!state||!delta)return;state.activeSeconds+=delta;const cycles=Math.floor(state.activeSeconds/60)-Math.floor((state.activeSeconds-delta)/60);if(cycles>0){for(const b of state.businesses){const c=catalog[b.type];if(!c)continue;state.revenue+=c.revenue*cycles;state.expenses+=c.expense*cycles;state.cash+=(c.revenue-c.expense)*cycles;b.cycles+=cycles}log('Completed '+cycles+' operating cycle(s)');save();render()}else{unsaved=true;if(current==='dashboard'||current==='settings')render()}}
$('startApps').innerHTML=apps.map(([id,icon,label])=>'<button data-app="'+id+'"><span>'+icon+'</span>'+label+'</button>').join('');$('startApps').addEventListener('click',e=>{const b=e.target.closest('[data-app]');if(b)navigate(b.dataset.app)});$('desktopIcons').innerHTML=apps.map(([id,icon,label])=>'<button class="desktop-icon" data-app="'+id+'"><span class="symbol">'+icon+'</span><span>'+label+'</span></button>').join('');$('desktopIcons').addEventListener('click',e=>{const b=e.target.closest('button[data-app]');if(b)navigate(b.dataset.app)});
$('windowContent').addEventListener('click',e=>{if(e.target.id==='start'){const name=$('company').value.trim();if(!name){$('registerError').textContent='Enter a company name.';return}state={version:1,company:name,cash:100000,revenue:0,expenses:0,activeSeconds:0,businesses:[],nextId:1,log:[],savedAt:unix()};log('Registered '+name+' with '+money(100000)+' startup capital');createBusiness($('industry').value,catalog[$('industry').value].label+' 1');lastTick=unix();render()}else if(e.target.id==='openBusiness'){const type=$('newIndustry').value,name=$('businessName').value.trim()||catalog[type].label+' '+state.nextId;if(!createBusiness(type,name))$('businessError').textContent='Insufficient funds.'}else if(e.target.id==='saveNow')save()});
$('closeWindow').onclick=()=>{minimized=true;render()};$('minWindow').onclick=()=>{minimized=true;render()};$('maxWindow').onclick=()=>{maximized=!maximized;minimized=false;render()};$('taskApp').onclick=()=>{minimized=!minimized;render()};$('launcher').onclick=()=>{const open=$('startMenu').hidden;$('startMenu').hidden=!open;$('launcher').setAttribute('aria-expanded',String(open))};$('showDesktop').onclick=()=>{minimized=true;hideMenu();render()};$('workspace').addEventListener('click',e=>{if(e.target.id==='workspace')hideMenu()});
load();lastTick=unix();render();if(state)$('saveStatus').textContent='Last saved · '+new Date(state.savedAt*1000).toLocaleTimeString();function clock(){ $('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});$('trayClock').textContent=$('clock').textContent}clock();setInterval(clock,10000);setInterval(()=>{if(document.hidden)lastTick=unix();else tick()},1000);setInterval(()=>{if(unsaved)save()},10000);document.addEventListener('visibilitychange',()=>{lastTick=unix();if(document.hidden&&unsaved)save()});window.addEventListener('pagehide',()=>{if(unsaved)save()});
})();
</script></body></html>
