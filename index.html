<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge to Rise</title><style>
:root{--gold:#e0b963;--bright:#ffe3a0;--bg:#080c13;--panel:#121a25;--line:#685335;--txt:#f0e9db;--muted:#bcb3a4}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:#080c13;color:var(--txt);font-family:Georgia,serif;touch-action:manipulation}
button{font:inherit;cursor:pointer;color:var(--txt);touch-action:manipulation}
[hidden]{display:none!important}
.shell{height:100dvh;width:100%;display:flex;flex-direction:column;background:#0b1018;border:1px solid #78603a;overflow:hidden}
header{flex:0 0 57px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 17px;border-bottom:1px solid var(--line);background:#101620}
h1{font-size:clamp(22px,2.8vw,32px);letter-spacing:2px;color:var(--bright);margin:0;text-shadow:0 2px 10px #ad702c77}
.eyebrow{font:11px Arial,sans-serif;letter-spacing:1.6px;color:#b8aa8e}
.stats{display:flex;gap:24px;text-align:center;font:12px Arial,sans-serif}.stats strong{display:block;font-size:19px;color:var(--bright);margin-top:2px}
.layout{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;padding:10px}
.left,.right{min-height:0;display:flex;flex-direction:column;gap:9px}
.panel{border:1px solid #56472e;border-radius:7px;background:linear-gradient(155deg,#17202d,#10151e);padding:10px;min-height:0}
.scene{flex:0 0 46%;min-height:0;position:relative;overflow:hidden;border-radius:7px;border:1px solid #5b4b35;background:linear-gradient(#17253c,#283043 52%,#111821 52%,#080c12)}
.scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,#d09b5244,transparent 48%),repeating-linear-gradient(90deg,transparent 0 49px,#0002 50px 52px)}
.moon{position:absolute;right:17%;top:15%;width:40px;height:40px;background:#e5d7ac;border-radius:50%;box-shadow:0 0 40px #b2b5b499}
.arch{position:absolute;left:29%;bottom:-15px;width:42%;height:82%;border:20px solid #35343a;border-bottom:0;border-radius:48% 48% 0 0;background:linear-gradient(110deg,#07090e,#27222b 50%,#080a10);box-shadow:0 0 0 8px #15191f,0 0 30px #000}
.path{position:absolute;bottom:-35px;left:10%;width:80%;height:85px;background:#6b553c44;clip-path:polygon(42% 0,58% 0,100% 100%,0 100%)}
.rune{position:absolute;left:47%;top:44%;color:#f1c46e;font-size:32px;text-shadow:0 0 18px #ffb83e}
.sceneLabel{position:absolute;left:10px;bottom:9px;padding:5px 9px;background:#060a11cc;border:1px solid #665034;color:var(--bright);font-size:14px}
.room-panel{flex:1;overflow-y:auto}h2{font-size:21px;color:var(--gold);margin:0 0 7px}.description{line-height:1.38;font-size:15px}
.log{font-size:14px;color:#e8cf9d;border-left:3px solid #9e783a;padding:7px 9px;background:#0b111b;margin:9px 0 0}
h3{font:12px Arial,sans-serif;letter-spacing:1.5px;color:var(--gold);margin:5px 0 7px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.btn{background:linear-gradient(#34404d,#202b38);border:1px solid #8a7046;border-radius:5px;padding:8px 6px;min-height:37px;font-size:14px}
.btn:active{background:#66512e}.btn:disabled{opacity:.32;cursor:default}.btn.gold{background:linear-gradient(#70532b,#47341f);color:#fff1d0}
.controls{flex:0 0 auto}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;max-width:350px;margin:0 auto}.nav .btn{min-height:42px;font-size:15px;font-weight:bold}.nav .empty{visibility:hidden}
#actions{min-height:34px}#actions .btn{min-height:37px}
.battle-title{margin-top:10px}.bar{height:10px;background:#070b10;border:1px solid #705e45;border-radius:20px;overflow:hidden;margin:6px 0 9px}.fill{height:100%;background:linear-gradient(90deg,#a43e3b,#e58c62);width:100%}
.details{flex:1;display:flex;flex-direction:column;min-height:0}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tabs .btn{font-size:14px;min-height:34px;padding:6px 3px}.tabs .active{background:#654c2c}
#side{min-height:0;overflow-y:auto;flex:1;padding-top:6px}.info{font:14px Arial,sans-serif;line-height:1.48}.info b{color:#ffe0a0}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-width:100%}.tile{min-height:37px;background:#101722;border:1px solid #343b42;border-radius:4px;display:flex;align-items:center;justify-content:center;font:11px Arial,sans-serif;text-align:center;padding:2px}.tile.seen{background:#384334;border-color:#7a7449}.tile.here{background:#896232;color:#fff;border-color:#e5c87c}
.items{font-size:14px;line-height:1.7}.note{font:12px Arial,sans-serif;color:#a9a18f;line-height:1.35;margin:5px 0}
.adventure{flex:0 0 auto}.adventure .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}.adventure .btn{min-height:34px;font-size:12px}.adventure .note{display:none}
footer{flex:0 0 19px;padding:3px 12px;border-top:1px solid #4e422f;font:11px Arial,sans-serif;color:#aaa18f;display:flex;justify-content:space-between;gap:8px}
@media(max-height:620px){.scene{flex-basis:43%}.nav .btn{min-height:36px}.controls{padding:8px}.details{padding:8px}.adventure{padding:7px}h3{margin:4px 0 5px}}
@media(max-width:700px){.layout{gap:6px;padding:6px}.stats{gap:9px}.scene{flex-basis:40%}header{padding:5px 9px}h1{font-size:20px}.panel{padding:7px}.nav .btn{font-size:12px}.btn{font-size:12px}.info{font-size:12px}.description{font-size:13px}.log{font-size:12px}}
</style></head><body><div class="shell">
<header><div><h1>FORGE TO RISE</h1><div class="eyebrow">THE ASHEN KEEP · CHAPTER I</div></div><div class="stats"><div>HEALTH<strong id="hpTop">30/30</strong></div><div>GOLD<strong id="goldTop">0</strong></div><div>LEVEL<strong id="levelTop">1</strong></div></div></header>
<main class="layout"><section class="left"><div class="scene"><div class="moon"></div><div class="arch"></div><div class="path"></div><div class="rune">✦</div><div class="sceneLabel" id="sceneLabel">Ashen Approach</div></div><div class="panel room-panel"><h2 id="roomTitle"></h2><div class="description" id="desc"></div><div class="log" id="log" aria-live="polite"></div></div></section>
<section class="right"><div class="panel controls"><div id="explore"><h3>TRAVEL</h3><div class="nav"><span class="empty"></span><button class="btn" onclick="move('n')">▲ North</button><span class="empty"></span><button class="btn" onclick="move('w')">◀ West</button><button class="btn gold" onclick="searchRoom()">Search</button><button class="btn" onclick="move('e')">East ▶</button><span class="empty"></span><button class="btn" onclick="move('s')">▼ South</button><span class="empty"></span></div><h3>ROOM ACTIONS</h3><div class="grid" id="actions"></div></div><div id="battle" hidden><h3 id="enemyName"></h3><div class="bar"><div class="fill" id="enemyBar"></div></div><div class="grid"><button class="btn gold" onclick="fight('attack')">Attack</button><button class="btn" onclick="fight('defend')">Defend</button><button class="btn" onclick="fight('potion')">Use Potion</button><button class="btn" onclick="fight('run')">Run</button></div></div></div>
<div class="panel details"><div class="tabs"><button class="btn active" id="tabStatus" onclick="tab('status')">Character</button><button class="btn" id="tabInventory" onclick="tab('inventory')">Inventory</button><button class="btn" id="tabMap" onclick="tab('map')">Map</button></div><div id="side"></div></div><div class="panel adventure"><div class="grid"><button class="btn" onclick="save()">Save</button><button class="btn" onclick="load()">Load</button><button class="btn" onclick="resetGame()">New Game</button><button class="btn" onclick="tab('map')">Dungeon Map</button></div><p class="note">Progress is saved in this browser's local storage, when available. Second Life media storage may be cleared independently of the prim.</p></div></section></main>
<footer><span>Forge to Rise · HUD layout 0.3</span><span id="progress">0 / 11 rooms discovered</span></footer></div><script>
'use strict';
const rooms={
approach:{name:"Ashen Approach",x:1,y:3,desc:"Cold wind sweeps across the abandoned causeway. The keep's iron gate stands to the north.",exits:{n:"gate"},actions:[["Inspect the gate","gateHint"]]},
gate:{name:"Iron Gate",x:1,y:2,desc:"A weathered gate bars the way into the fortress. A narrow keyhole glimmers beneath the rust.",exits:{s:"approach",n:"hall"},lock:"gate",actions:[["Examine lock","gateHint"]]},
hall:{name:"Inner Hall",x:1,y:1,desc:"Torn banners hang above a long stone hall. Footprints disappear into the shadows.",exits:{s:"gate",w:"armory",e:"gallery",n:"court"},enemy:"sentinel"},
armory:{name:"Forgotten Armory",x:0,y:1,desc:"Broken shields and rusted blades lie beneath a fallen weapon rack.",exits:{e:"hall",s:"cellar"},treasure:"blade"},
gallery:{name:"Hall of Embers",x:2,y:1,desc:"Charcoal portraits line the walls. A faint red glow spills from the eastern doorway.",exits:{w:"hall",e:"forge",s:"library"},enemy:"wisp"},
court:{name:"Fallen Courtyard",x:1,y:0,desc:"An open courtyard lies beneath a starless sky. The old watchtower rises to the east.",exits:{s:"hall",e:"tower"},treasure:"potion"},
tower:{name:"Watchtower",x:2,y:0,desc:"From the broken battlements, you can see smoke rising beyond the valley.",exits:{w:"court",s:"forge"},treasure:"crest"},
forge:{name:"Dormant Forge",x:3,y:1,desc:"An ancient anvil stands beneath a cold chimney. The furnace waits for a spark.",exits:{w:"gallery",n:"tower",s:"sanctum"},lock:"forge",enemy:"guardian",actions:[["Awaken the forge","ignite"]]},
library:{name:"Dustbound Library",x:2,y:2,desc:"Rotting books cover the floor. A silver inscription describes a crest and a forgotten flame.",exits:{n:"gallery",w:"cellar"},treasure:"rune"},
cellar:{name:"Flooded Cellar",x:0,y:2,desc:"Black water covers the cellar floor. Something glints beneath a collapsed crate.",exits:{n:"armory",e:"library"},treasure:"key"},
sanctum:{name:"Ember Sanctum",x:3,y:2,desc:"A stone dais cradles the Heart of Embers, dormant for centuries.",exits:{n:"forge"},actions:[["Restore the Heart","finish"]]}
};
const foes={sentinel:{name:"Hollow Sentinel",hp:17,atk:5,gold:15},wisp:{name:"Ash Wisp",hp:13,atk:4,gold:12},guardian:{name:"Forge Guardian",hp:26,atk:7,gold:30}};
function initial(){return {room:"approach",hp:30,maxHp:30,gold:0,level:1,items:["Old Sword","Healing Potion"],flags:{},visited:["approach"],defeated:{},searched:{},combat:null,won:false,log:"Find a way into the Ashen Keep. Search your surroundings for supplies."}}
let s=initial(),view="status";
const $=id=>document.getElementById(id);
function say(t){s.log=t;render()}
function has(t){return s.items.includes(t)}
function add(t){if(!has(t))s.items.push(t)}
function room(){return rooms[s.room]}
function save(silent=false){try{localStorage.setItem("forge-to-rise-v1",JSON.stringify(s));if(!silent)say("Adventure saved on this device.")}catch(e){if(!silent)say("This browser did not allow local saving.")}}
function load(){try{const x=JSON.parse(localStorage.getItem("forge-to-rise-v1"));if(!x||!rooms[x.room]||!Array.isArray(x.items))return say("No saved adventure found.");s=x;s.combat=null;say("Saved adventure restored.")}catch(e){say("Saved adventure could not be read.")}}
function resetGame(){if(!confirm("Start a new adventure? Unsaved progress will be lost."))return;s=initial();save(true);say("A new journey begins at the Ashen Approach.")}
function tab(v){view=v;render()}
function move(dir){
if(s.combat)return;
let dest=room().exits[dir];if(!dest)return say("No passage leads that way.");
if(dest==="hall"&&!s.flags.gate)return say("The iron gate is locked. Search the approach for a hidden spare key.");
if(dest==="sanctum"&&!s.flags.forge)return say("The forge's sealed passage requires the Ember Rune and the Watcher's Crest.");
const origin=room().name;const direction={n:"North",s:"South",e:"East",w:"West"}[dir];s.room=dest;if(!s.visited.includes(dest))s.visited.push(dest);
if(rooms[dest].enemy&&!s.defeated[dest]){let e=foes[rooms[dest].enemy];s.combat={key:rooms[dest].enemy,hp:e.hp};s.log="Moved "+direction+" from "+origin+" to "+room().name+". A "+e.name+" blocks your path!";}else s.log="Moved "+direction+" from "+origin+" to "+room().name+".";
save(true);render();
}
function searchRoom(){
if(s.combat)return;
if(s.searched[s.room])return say("You've already searched this area thoroughly.");
s.searched[s.room]=true;let t=room().treasure;
if(s.room==="approach"){add("Iron Key");say("Beneath a loose paving stone, you find a spare Iron Key.");}
else if(t==="key"){add("Iron Key");say("You recover an Iron Key from the flooded crate.");}
else if(t==="blade"){add("Forged Blade");say("You discover a Forged Blade. Your attacks will strike harder.");}
else if(t==="potion"){add("Healing Potion");s.gold+=8;say("You find a Healing Potion and 8 gold.");}
else if(t==="crest"){add("Watcher's Crest");say("You recover the Watcher's Crest from the battlements.");}
else if(t==="rune"){add("Ember Rune");say("You decipher the inscription and claim the Ember Rune.");}
else {s.gold+=3;say("You search the room and find 3 gold.");}
save(true);
}
function action(key){
if(s.combat)return;
if(key==="gateHint")return say(has("Iron Key")?"The Iron Key fits the lock. Open the gate from here.":"A spare key may be hidden near the approach. Search the stones.");
if(key==="open"){if(!has("Iron Key"))return say("The gate will not move without an Iron Key.");s.flags.gate=true;say("The iron gate groans open. The Inner Hall lies north.");}
if(key==="ignite"){if(!has("Ember Rune")||!has("Watcher's Crest"))return say("The furnace needs both the Ember Rune and Watcher's Crest.");s.flags.forge=true;say("The ancient furnace flares to life, revealing the passage south.");}
if(key==="finish"){if(!s.flags.forge)return say("The Heart remains cold. Restore the forge first.");s.won=true;s.gold+=100;say("VICTORY! The Heart of Embers blazes again. The keep awakens. You earn 100 gold. Chapter I complete!");}
save(true);
}
function fight(act){
if(!s.combat)return;let f=foes[s.combat.key],msg="",def=false;
if(act==="run"){if(s.room==="hall")s.room="gate";else if(s.room==="gallery")s.room="hall";else s.room="gallery";s.combat=null;return say("You retreat to safety. The enemy still guards the room.");}
if(act==="potion"){let i=s.items.indexOf("Healing Potion");if(i<0)return say("You have no healing potions.");s.items.splice(i,1);s.hp=Math.min(s.maxHp,s.hp+14);msg="You recover 14 health (up to maximum). ";}
if(act==="attack"){let dmg=5+Math.floor(Math.random()*5)+(has("Forged Blade")?4:0);s.combat.hp-=dmg;msg="You deal "+dmg+" damage. ";}
if(act==="defend"){def=true;msg="You brace for the next strike. ";}
if(s.combat.hp<=0){s.defeated[s.room]=true;s.gold+=f.gold;s.combat=null;msg+="Victory! You collect "+f.gold+" gold.";if(Object.keys(s.defeated).length===3){s.level=2;s.maxHp=36;s.hp=Math.min(s.maxHp,s.hp+6);msg+=" You reach level 2!";}save(true);return say(msg);}
let hurt=Math.max(1,f.atk-2+Math.floor(Math.random()*4)-(def?4:0));s.hp-=hurt;msg+=f.name+" hits you for "+hurt+".";
if(s.hp<=0){s.hp=s.maxHp;s.gold=Math.max(0,s.gold-10);s.room="approach";s.combat=null;msg+=" You fall and awaken at the approach, losing up to 10 gold.";}
save(true);say(msg);
}
function render(){
$("hpTop").textContent=s.hp+"/"+s.maxHp;$("goldTop").textContent=s.gold;$("levelTop").textContent=s.level;
$("roomTitle").textContent=room().name;$("sceneLabel").textContent=room().name;$("desc").textContent=room().desc;$("log").textContent=s.log;
$("explore").hidden=!!s.combat;$("battle").hidden=!s.combat;
document.querySelectorAll(".nav button").forEach(b=>{let d=b.textContent.includes("North")?"n":b.textContent.includes("South")?"s":b.textContent.includes("East")?"e":b.textContent.includes("West")?"w":null;if(d)b.disabled=!room().exits[d]});
let actions=[...(room().actions||[])];if(s.room==="gate"&&!s.flags.gate)actions.push(["Open Gate","open"]);if(s.room==="gate"&&s.flags.gate)actions.push(["Gate Open","gateHint"]);
$("actions").innerHTML="";if(!actions.length){$("actions").textContent="Search the room or choose a direction."}else actions.forEach(([label,key])=>{let b=document.createElement("button");b.className="btn gold";b.textContent=label;b.onclick=()=>action(key);$("actions").appendChild(b)});
if(s.combat){let f=foes[s.combat.key];$("enemyName").textContent=f.name+" · "+Math.max(0,s.combat.hp)+"/"+f.hp+" HP";$("enemyBar").style.width=Math.max(0,100*s.combat.hp/f.hp)+"%"}
for(let v of ["status","inventory","map"])$("tab"+v[0].toUpperCase()+v.slice(1)).classList.toggle("active",view===v);
let side=$("side");side.innerHTML="";
if(view==="status"){side.innerHTML='<h3>ADVENTURER</h3><div class="info">Weapon: <b>'+(has("Forged Blade")?"Forged Blade":"Old Sword")+'</b><br>Location: <b>'+room().name+'</b><br>Level: <b>'+s.level+'</b><br>Rooms explored: <b>'+s.visited.length+'/11</b><br>Enemies defeated: <b>'+Object.keys(s.defeated).length+'/3</b></div><h3>HEALTH</h3><div class="bar"><div class="fill" style="width:'+(s.hp/s.maxHp*100)+'%"></div></div><p class="note">Quest: '+(s.won?"Chapter I complete — the Heart is restored.":"Find the Ember Rune and Watcher's Crest. Awaken the forge and restore the Heart of Embers.")+'</p>'}
if(view==="inventory"){let h=document.createElement("div");h.className="items";h.innerHTML="<h3>YOUR BELONGINGS</h3>";for(let item of s.items){let d=document.createElement("div");d.textContent="◆ "+item;h.appendChild(d)}if(!s.items.length)h.append("Your pack is empty.");side.appendChild(h)}
if(view==="map"){side.innerHTML="<h3>DISCOVERED ROOMS</h3>";let m=document.createElement("div");m.className="map";for(let y=0;y<4;y++)for(let x=0;x<4;x++){let id=Object.keys(rooms).find(k=>rooms[k].x===x&&rooms[k].y===y);let t=document.createElement("div");t.className="tile"+(id&&s.visited.includes(id)?" seen":"")+(id===s.room?" here":"");t.textContent=id&&s.visited.includes(id)?(id===s.room?"◆ ":"")+rooms[id].name:"·";m.appendChild(t)}side.appendChild(m);let p=document.createElement("p");p.className="note";p.textContent="Only visited rooms are revealed. ◆ marks your location.";side.appendChild(p)}
$("progress").textContent=s.visited.length+" / 11 rooms discovered";
}
try{let stored=JSON.parse(localStorage.getItem("forge-to-rise-v1"));if(stored&&rooms[stored.room]&&Array.isArray(stored.items)){s=stored;s.combat=null;s.log="Welcome back to Forge to Rise. Your adventure was restored."}}catch(e){}
render();
</script></body></html>
